<div class="editor-toolbar" aria-label="Editor toolbar">
  <div class="toolbar-history">
    <button type="button" aria-label="Go back" (click)="back()">
      <i class="bi bi-arrow-left"></i>
    </button>
    <button type="button" aria-label="Go forward" (click)="forward()">
      <i class="bi bi-arrow-right"></i>
    </button>
  </div>
  <a [routerLink]="currentSection().route" class="toolbar-select"
    >{{ currentSection().label }} <i class="bi bi-chevron-down" aria-hidden="true"></i
  ></a>
  <span class="toolbar-preview" aria-label="Portfolio preview mode">
    <i class="bi bi-play" aria-hidden="true"></i> Preview
  </span>
  <div class="toolbar-views" aria-hidden="true">
    <span><i class="bi bi-grid"></i></span><span><i class="bi bi-list-ul"></i></span>
  </div>
</div>
